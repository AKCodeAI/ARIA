[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AKCodeAI", email = "abdulkhaliqcodes@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "arxiv>=4.0.2",
    "fastapi>=0.162.0",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
